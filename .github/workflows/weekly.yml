name: Angebote aktualisieren

# Scrapes all six chains and publishes the site, so it stays current even while
# the Mac is switched off. A probe run (tools/cloud_probe.py) confirmed all six
# answer a GitHub runner -- but only when driven by *real* Chrome: with the
# bundled Chromium, EDEKA and NETTO return "Access Denied". What Akamai scores
# is the browser fingerprint, not the datacenter IP.
on:
  schedule:
    - cron: '20 5 * * 1'      # Mondays 05:20 UTC (07:20 Berlin, 06:20 in winter)
  workflow_dispatch:

concurrency:
  group: offers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Abhängigkeiten
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright beautifulsoup4 lxml pillow
          python -m playwright install --with-deps chromium

      - name: Echtes Google Chrome
        # Not optional: EDEKA and NETTO refuse the bundled Chromium outright.
        run: |
          python -m playwright install chrome
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(channel="chrome")
              print("Chrome ok:", b.version)
              b.close()
          EOF

      - name: Bild-Cache
        uses: actions/cache@v4
        with:
          path: web/img
          key: offer-images-${{ github.run_id }}
          restore-keys: offer-images-

      - name: Angebote einlesen
        run: python run.py

      - name: Bilder zwischenspeichern
        run: python tools/images.py

      - name: Website bauen
        run: python build_site.py

      - name: Veröffentlichen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/publish.sh

      - name: Zusammenfassung
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          d = json.load(open("data/latest.json"))
          print(f"## {d['iso_week']} — {d['counts']['total']} Angebote\n")
          print("| Kette | Angebote | Märkte |")
          print("|---|---:|---:|")
          for m in d["sources"].values():
              state = m["count"] if m["ok"] else "FEHLER"
              print(f"| {m['name']} | {state} | {m.get('markets', 0)} |")
          print(f"\n{d['counts']['free']} Gratis-/Cashback-Treffer.")
          EOF
