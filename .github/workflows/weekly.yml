name: Angebote aktualisieren

# Scrapes the chains and publishes the site, so it stays current even when the
# Mac is switched off. Only the chains that actually answer from a datacenter
# IP are scraped here; see CLOUD.md for what runs where.
on:
  schedule:
    - cron: '20 5 * * 1'      # Mondays 05:20 UTC = 07:20 Berlin (06:20 in winter)
  workflow_dispatch:

concurrency:
  group: offers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Abhängigkeiten
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright beautifulsoup4 lxml pillow
          python -m playwright install --with-deps chromium
          python -m playwright install chrome || true

      - name: Bild-Cache
        uses: actions/cache@v4
        with:
          path: web/img
          key: offer-images-${{ github.run_id }}
          restore-keys: offer-images-

      - name: Angebote einlesen
        env:
          CHAINS: ${{ vars.CLOUD_CHAINS }}
        run: |
          python run.py ${CHAINS:+--only "$CHAINS"}

      - name: Bilder und Website
        run: |
          python tools/images.py
          python build_site.py

      - name: Veröffentlichen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/publish.sh
