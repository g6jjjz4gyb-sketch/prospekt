name: Erreichbarkeit prüfen

# Manual only: finds out which chains answer a GitHub runner's datacenter IP.
# The scraper was built on a home connection, and Akamai treats the two very
# differently -- this measures it instead of assuming.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright beautifulsoup4 lxml pillow
          python -m playwright install --with-deps chromium
          python -m playwright install chrome || echo "Google Chrome nicht verfügbar"

      - name: Mit echtem Chrome prüfen
        env:
          PROBE_CHANNEL: chrome
        run: python tools/cloud_probe.py || true

      - name: Mit gebündeltem Chromium prüfen
        run: python tools/cloud_probe.py || true

      - name: REWE-Strategien vergleichen
        env:
          PROBE_CHANNEL: chrome
        run: python tools/rewe_strategies.py || true

      - name: REWE im Detail (warum 0 Angebote im vollen Lauf?)
        env:
          PROBE_CHANNEL: chrome
          PROBE_REWE_DEEP: "1"
        run: python tools/cloud_probe.py || true
